[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

# -O2: enable loop-vectorisation and instruction scheduling on the checksum loop.
# CONFIG_ESP32_DEFAULT_CPU_FREQ_240: ensure 240 MHz is the compile-time default.
# CONFIG_SPI_SLAVE_IN_IRAM: keeps spi_slave ISR in IRAM for deterministic latency.
build_flags =
    -O2
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_SPI_SLAVE_IN_IRAM=1

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
